# =============================================================
# .github/workflows/e2e-tests.yaml
# Tests end-to-end : vérifie le comportement réel de la préemption
# Déclenché sur main et develop uniquement (plus lent)
# =============================================================

name: E2E Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:  # Déclenchement manuel

jobs:
  e2e-pod-priority:
    name: E2E — Pod Priority & Preemption
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Create kind cluster (ressources limitées pour forcer la préemption)
      uses: helm/kind-action@v1.9.0
      with:
        cluster_name: e2e-cluster
        node_image: kindest/node:v1.29.0
        config: |
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
          - role: worker
          - role: worker

    - name: Setup - Créer les PriorityClasses
      run: |
        kubectl apply -f 01-pod-priority/manifests/00-priority-classes.yaml
        kubectl get priorityclasses

    - name: Test 1 - Vérifier que les PriorityClasses existent
      run: |
        echo "=== TEST 1: PriorityClasses ==="
        for pc in high-priority medium-priority low-priority high-priority-no-preempt; do
          if kubectl get priorityclass "$pc" > /dev/null 2>&1; then
            VALUE=$(kubectl get priorityclass "$pc" -o jsonpath='{.value}')
            echo "✅ $pc existe (value: $VALUE)"
          else
            echo "❌ $pc manquant!"
            exit 1
          fi
        done

    - name: Test 2 - Vérifier les valeurs de priorité
      run: |
        echo "=== TEST 2: Valeurs de priorité ==="
        HIGH=$(kubectl get priorityclass high-priority -o jsonpath='{.value}')
        MEDIUM=$(kubectl get priorityclass medium-priority -o jsonpath='{.value}')
        LOW=$(kubectl get priorityclass low-priority -o jsonpath='{.value}')
        
        if [ "$HIGH" -gt "$MEDIUM" ] && [ "$MEDIUM" -gt "$LOW" ]; then
          echo "✅ Ordre correct: high($HIGH) > medium($MEDIUM) > low($LOW)"
        else
          echo "❌ Ordre incorrect!"
          exit 1
        fi

    - name: Test 3 - Vérifier globalDefault
      run: |
        echo "=== TEST 3: globalDefault ==="
        DEFAULT_PC=$(kubectl get priorityclasses -o json | \
          jq -r '.items[] | select(.globalDefault == true) | .metadata.name')
        
        if [ "$DEFAULT_PC" = "low-priority" ]; then
          echo "✅ globalDefault correct: $DEFAULT_PC"
        else
          echo "❌ globalDefault attendu 'low-priority', obtenu: '$DEFAULT_PC'"
          exit 1
        fi

    - name: Test 4 - Pod avec priorityClassName hérite la priorité
      run: |
        echo "=== TEST 4: Héritage de priorité ==="
        kubectl run test-pod \
          --image=busybox:1.36 \
          --restart=Never \
          --overrides='{"spec":{"priorityClassName":"high-priority","containers":[{"name":"test-pod","image":"busybox:1.36","command":["sleep","30"]}]}}' \
          -- sleep 30
        
        # Attendre que le pod soit schedulé
        kubectl wait --for=condition=Ready pod/test-pod --timeout=60s || true
        
        PRIORITY=$(kubectl get pod test-pod -o jsonpath='{.spec.priority}')
        echo "Priorité du pod: $PRIORITY"
        
        if [ "$PRIORITY" = "1000000" ]; then
          echo "✅ Pod a bien la priorité 1000000"
        else
          echo "❌ Priorité incorrecte: $PRIORITY (attendu: 1000000)"
          exit 1
        fi
        
        kubectl delete pod test-pod --grace-period=0

  e2e-apf:
    name: E2E — API Priority & Fairness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Create kind cluster
      uses: helm/kind-action@v1.9.0
      with:
        cluster_name: e2e-apf
        node_image: kindest/node:v1.29.0

    - name: Test 1 - APF activé par défaut
      run: |
        echo "=== TEST APF 1: APF activé ==="
        if kubectl get flowschemas > /dev/null 2>&1; then
          COUNT=$(kubectl get flowschemas --no-headers | wc -l)
          echo "✅ APF activé - $COUNT FlowSchemas existants"
        else
          echo "❌ APF non activé!"
          exit 1
        fi

    - name: Test 2 - FlowSchemas système présents
      run: |
        echo "=== TEST APF 2: FlowSchemas système ==="
        for fs in exempt catch-all global-default; do
          if kubectl get flowschema "$fs" > /dev/null 2>&1; then
            echo "✅ FlowSchema $fs présent"
          else
            echo "❌ FlowSchema $fs manquant!"
            exit 1
          fi
        done

    - name: Test 3 - Créer PriorityLevel custom
      run: |
        echo "=== TEST APF 3: PriorityLevel custom ==="
        kubectl apply -f 02-api-priority-fairness/manifests/02-priority-level-custom.yaml
        
        for pl in demo-priority demo-restricted; do
          if kubectl get prioritylevelconfiguration "$pl" > /dev/null 2>&1; then
            echo "✅ PriorityLevel $pl créé"
          else
            echo "❌ PriorityLevel $pl manquant!"
            exit 1
          fi
        done

    - name: Test 4 - Créer FlowSchema custom
      run: |
        echo "=== TEST APF 4: FlowSchema custom ==="
        kubectl apply -f 02-api-priority-fairness/manifests/01-flow-schema-custom.yaml
        
        for fs in demo-workloads demo-restricted-sa; do
          if kubectl get flowschema "$fs" > /dev/null 2>&1; then
            PRIORITY=$(kubectl get flowschema "$fs" -o jsonpath='{.spec.priorityLevelConfiguration.name}')
            echo "✅ FlowSchema $fs → $PRIORITY"
          else
            echo "❌ FlowSchema $fs manquant!"
            exit 1
          fi
        done

    - name: Test 5 - Ordre de matching correct
      run: |
        echo "=== TEST APF 5: Ordre de matching ==="
        DEMO_PRECEDENCE=$(kubectl get flowschema demo-workloads -o jsonpath='{.spec.matchingPrecedence}')
        RESTRICTED_PRECEDENCE=$(kubectl get flowschema demo-restricted-sa -o jsonpath='{.spec.matchingPrecedence}')
        
        if [ "$RESTRICTED_PRECEDENCE" -lt "$DEMO_PRECEDENCE" ]; then
          echo "✅ Ordre correct: restricted($RESTRICTED_PRECEDENCE) matché avant workloads($DEMO_PRECEDENCE)"
        else
          echo "❌ Ordre incorrect!"
          exit 1
        fi

  e2e-production:
    name: E2E — Production Scenario
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [e2e-pod-priority, e2e-apf]

    steps:
    - uses: actions/checkout@v4

    - name: Create kind cluster multi-worker
      uses: helm/kind-action@v1.9.0
      with:
        cluster_name: e2e-prod
        node_image: kindest/node:v1.29.0
        config: |
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
          - role: worker
          - role: worker
          - role: worker

    - name: Apply production config (ordre correct)
      run: |
        kubectl apply -f 03-production-like/manifests/00-namespaces.yaml
        kubectl apply -f 03-production-like/manifests/01-priority-classes.yaml
        sleep 2
        kubectl apply -f 03-production-like/manifests/06-apf-priority-levels.yaml
        kubectl apply -f 03-production-like/manifests/05-apf-flow-schemas.yaml

    - name: Test - Namespaces créés
      run: |
        for ns in production staging batch; do
          kubectl get namespace "$ns" || (echo "❌ Namespace $ns manquant" && exit 1)
          echo "✅ Namespace $ns OK"
        done

    - name: Test - PriorityClasses production
      run: |
        for pc in critical high standard batch development; do
          kubectl get priorityclass "$pc" || (echo "❌ PriorityClass $pc manquante" && exit 1)
          echo "✅ PriorityClass $pc OK"
        done

    - name: Test - APF production
      run: |
        for pl in prod-high staging-std batch-low; do
          kubectl get prioritylevelconfiguration "$pl" || (echo "❌ PriorityLevel $pl manquant" && exit 1)
          echo "✅ PriorityLevel $pl OK"
        done
        
        for fs in production-critical staging-standard batch-restricted; do
          kubectl get flowschema "$fs" || (echo "❌ FlowSchema $fs manquant" && exit 1)
          echo "✅ FlowSchema $fs OK"
        done

    - name: Deploy workloads and verify
      run: |
        kubectl apply -f 03-production-like/manifests/02-critical-workloads.yaml
        kubectl apply -f 03-production-like/manifests/03-standard-workloads.yaml
        kubectl apply -f 03-production-like/manifests/04-batch-workloads.yaml
        
        # Attendre les déploiements critiques
        kubectl rollout status deployment/payment-api -n production --timeout=120s
        kubectl rollout status deployment/auth-service -n production --timeout=120s
        
        echo "✅ Workloads critiques déployés"

    - name: Test - PDB présents
      run: |
        for pdb in payment-api-pdb auth-service-pdb; do
          kubectl get pdb "$pdb" -n production || (echo "❌ PDB $pdb manquant" && exit 1)
          echo "✅ PDB $pdb OK"
        done

    - name: Final report
      run: |
        echo ""
        echo "=========================================="
        echo "         RAPPORT E2E FINAL"
        echo "=========================================="
        echo ""
        echo "PriorityClasses:"
        kubectl get priorityclasses --no-headers
        echo ""
        echo "FlowSchemas custom:"
        kubectl get flowschemas | grep -E "production-|staging-|batch-"
        echo ""
        echo "PriorityLevels custom:"
        kubectl get prioritylevelconfigurations | grep -E "prod-|staging-|batch-"
        echo ""
        echo "Pods en production:"
        kubectl get pods -n production
        echo ""
        echo "✅ Tous les tests E2E passent !"
