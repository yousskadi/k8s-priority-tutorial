# =============================================================
# .github/workflows/validate.yaml
# Workflow de validation : lint YAML + dry-run kubectl
# Déclenché sur toutes les branches (PR et push)
# =============================================================

name: Validate Manifests

on:
  push:
    branches: ["**"]        # toutes les branches, y compris feature/*
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - ".github/workflows/*.yaml"
  pull_request:
    branches: ["main", "develop"]
    
jobs:
  # ─── Job 1 : Lint YAML ───────────────────────────────────────
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install yamllint
      run: pip install yamllint

    - name: Run yamllint (manifests uniquement, pas les workflows)
      run: |
        find . -name "*.yaml" \
          -not -path "./.git/*" \
          -not -path "./.github/*" \
          -not -name ".yamllint.yaml" \
          | xargs yamllint -c .yamllint.yaml

    - name: Run yamllint
      run: |
        find . -name "*.yaml" -not -path "./.git/*" | xargs yamllint -c .yamllint.yaml

  # ─── Job 2 : Kubernetes Schema Validation ────────────────────
  schema-validation:
    name: Schema Validation (kubeval)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install kubeconform
      run: |
        curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
        sudo mv kubeconform /usr/local/bin/

    - name: Validate all manifests
      run: |
        find . -name "*.yaml" -not -path "./.git/*" | while read f; do
          echo "Validating $f..."
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version 1.29.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$f" || true  # continue même si erreur pour les CRDs custom
        done

  # ─── Job 3 : Dry Run sur kind ────────────────────────────────
  dry-run:
    name: Dry Run on kind
    runs-on: ubuntu-latest
    needs: [yaml-lint, schema-validation]
    steps:
    - uses: actions/checkout@v4

    - name: Setup kind
      uses: helm/kind-action@v1.9.0
      with:
        cluster_name: ci-cluster
        node_image: kindest/node:v1.29.0
        config: |
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
          - role: worker
          - role: worker

    - name: Wait for cluster ready
      run: |
        kubectl wait --for=condition=Ready nodes --all --timeout=120s
        kubectl get nodes

    - name: Test Module 01 - Pod Priority
      run: |
        echo "=== Module 01: Pod Priority ==="
        kubectl apply --dry-run=server -f 01-pod-priority/manifests/
        echo "✅ Module 01 dry-run OK"

    - name: Apply Module 01 - Pod Priority
      run: |
        kubectl apply -f 01-pod-priority/manifests/00-priority-classes.yaml
        kubectl get priorityclasses | grep -E "high-priority|medium-priority|low-priority"
        echo "✅ PriorityClasses créées"

    - name: Test Module 02 — APF (PriorityLevels d'abord, FlowSchemas ensuite)
      run: |
        echo "=== Module 02: API Priority & Fairness ==="
        # PriorityLevels AVANT FlowSchemas (dépendance obligatoire)
        kubectl apply -f 02-api-priority-fairness/manifests/02-priority-level-custom.yaml
        kubectl get prioritylevelconfigurations | grep -E "demo-priority|demo-restricted"

        kubectl apply -f 02-api-priority-fairness/manifests/01-flow-schema-custom.yaml
        kubectl get flowschemas | grep -E "demo-workloads|demo-restricted-sa"
        echo "✅ APF custom OK"

    - name: Test Module 03 - Production
      run: |
        echo "=== Module 03: Production-like ==="
        # Appliquer dans le bon ordre (PriorityLevels avant FlowSchemas)
        kubectl apply -f 03-production-like/manifests/00-namespaces.yaml
        kubectl apply -f 03-production-like/manifests/01-priority-classes.yaml
        kubectl apply -f 03-production-like/manifests/06-apf-priority-levels.yaml
        kubectl apply -f 03-production-like/manifests/05-apf-flow-schemas.yaml
        
        # Dry-run des workloads
        kubectl apply --dry-run=server -f 03-production-like/manifests/02-critical-workloads.yaml
        kubectl apply --dry-run=server -f 03-production-like/manifests/03-standard-workloads.yaml
        kubectl apply --dry-run=server -f 03-production-like/manifests/04-batch-workloads.yaml
        echo "✅ Module 03 dry-run OK"

    - name: Final Summary
      run: |
        echo ""
        echo "=== RÉSUMÉ FINAL ==="
        echo "PriorityClasses:"
        kubectl get priorityclasses --no-headers | grep -E "critical|high|standard|batch|development|low-priority|medium-priority"
        echo ""
        echo "Custom FlowSchemas:"
        kubectl get flowschemas | grep -E "demo-|production-|staging-|batch-"
        echo ""
        echo "Custom PriorityLevels:"
        kubectl get prioritylevelconfigurations | grep -E "demo-|prod-|staging-|batch-"
        echo ""
        echo "✅ Tous les tests passent !"
