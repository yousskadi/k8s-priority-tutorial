# =============================================================
# 04-batch-workloads.yaml
# Jobs batch — seront éjectés si besoin par les workloads critiques
# Doivent être idempotents et tolérants aux interruptions
# =============================================================

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: batch-sa
  namespace: batch
  labels:
    app.kubernetes.io/part-of: priority-tutorial

---
# Pipeline de données — peut être interrompu et redémarré
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-pipeline
  namespace: batch
  labels:
    app: data-pipeline
    tier: batch
    app.kubernetes.io/part-of: priority-tutorial
spec:
  replicas: 5
  selector:
    matchLabels:
      app: data-pipeline
  template:
    metadata:
      labels:
        app: data-pipeline
        tier: batch
    spec:
      serviceAccountName: batch-sa
      priorityClassName: batch
      terminationGracePeriodSeconds: 30
      containers:
      - name: pipeline
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          CHECKPOINT_FILE="/tmp/checkpoint"
          if [ -f "$CHECKPOINT_FILE" ]; then
            STEP=$(cat "$CHECKPOINT_FILE")
            echo "Reprise depuis le step $STEP"
          else
            STEP=0
          fi
          trap 'echo "SIGTERM recu - sauvegarde step $STEP"; echo $STEP > $CHECKPOINT_FILE; exit 0' TERM
          while true; do
            STEP=$((STEP + 1))
            echo "[$(date)] Traitement step $STEP..."
            sleep 5
            if [ $((STEP % 10)) -eq 0 ]; then
              echo $STEP > "$CHECKPOINT_FILE"
              echo "[$(date)] Checkpoint sauve: step $STEP"
            fi
          done
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: checkpoint-volume
          mountPath: /tmp
      volumes:
      - name: checkpoint-volume
        emptyDir: {}
